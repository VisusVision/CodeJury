name: Nightly Pool Soak

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: "Full consistency soak duration (requires Ollama); 0 skips"
        required: false
        default: "0"

jobs:
  pool-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build sandbox image
        run: docker build -t agentgrade-sandbox sandbox-images/agentgrade/

      - name: Pool smoke (init + execute + shutdown)
        env:
          SANDBOX_POOL_SIZE: "2"
          SANDBOX_POOL_BASE_PORT: "8181"
          SANDBOX_POOL_TIMEOUT: "90"
        run: python scripts/qa_pool_smoke.py

  consistency-soak:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.soak_minutes != '0'
    runs-on: ubuntu-latest
    needs: pool-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r frontend/backend/requirements.txt

      - name: Build sandbox image
        run: docker build -t agentgrade-sandbox sandbox-images/agentgrade/

      - name: Run pool consistency soak
        env:
          SANDBOX_POOL_SIZE: "2"
          SANDBOX_POOL_BASE_PORT: "8181"
          SANDBOX_POOL_TIMEOUT: "90"
        run: python scripts/qa_soak_consistency.py --pool --minutes "${{ github.event.inputs.soak_minutes }}"
